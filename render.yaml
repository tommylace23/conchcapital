databases:
  - name: conchcapital-db
    plan: free
    databaseName: conchcapital
    user: conchcapital

services:
  - type: web
    name: conchcapital
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: conchcapital-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: conchcapital-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: conchcapital-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: conchcapital-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: conchcapital-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
