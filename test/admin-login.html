<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <script src="https://cdn.tailwindcss.com"></script> <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"> <link rel="stylesheet" href="css/main.css?v=20261123b"> <title>Admin Portal | ConchCapital</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png"> <style> body { font-family: 'Inter', sans-serif; } .bg-admin-dark { background-color: #0F172A; } .btn-admin { background-color: #1E293B; border: 1px solid #334155; } .btn-admin:hover { background-color: #334155; } </style> </head> <body class="bg-slate-950 min-h-screen flex flex-col justify-center py-12 px-6" data-page="adminLogin">

<div class="sm:mx-auto sm:w-full sm:max-w-md text-center mb-10">
    <div class="text-2xl font-bold tracking-widest text-white uppercase">
        Conch<span class="text-[#10B981]">Capital</span> <span class="text-slate-500 font-light">Admin</span>
    </div>
</div>

<div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white p-8 md:p-10 shadow-2xl rounded-2xl border border-slate-200">
        
        <div class="mb-8">
            <h2 class="text-xl font-bold text-slate-900">Secure Access</h2>
            <p class="text-sm text-slate-500 mt-1">Authorized personnel only.</p>
        </div>

        <div class="mb-8 p-4 bg-slate-50 border-l-4 border-slate-900 flex gap-4">
            <i class="fa-solid fa-shield-halved text-slate-900 mt-1"></i>
            <p class="text-[11px] text-slate-600 leading-relaxed uppercase tracking-tight">
                <strong>Notice:</strong> This system is for authorized use only. All login attempts and IP addresses are logged and monitored for security purposes.
            </p>
        </div>

        <form id="adminLoginForm" class="space-y-6">
            <div>
                <label for="admin-email" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Admin Identifier</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                        <i class="fa-solid fa-user-shield text-sm"></i>
                    </span>
                    <input id="admin-email" name="admin-email" type="email" required placeholder="admin@conchcapital.co"
                        class="w-full pl-11 pr-4 py-3.5 bg-gray-50 rounded-xl border border-gray-200 focus:ring-2 focus:ring-slate-900 focus:border-transparent outline-none transition text-sm">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Security Key</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                        <i class="fa-solid fa-key text-sm"></i>
                    </span>
                    <input id="password" name="password" type="password" required placeholder="••••••••••••"
                        class="w-full pl-11 pr-4 py-3.5 bg-gray-50 rounded-xl border border-gray-200 focus:ring-2 focus:ring-slate-900 focus:border-transparent outline-none transition text-sm">
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full flex justify-center py-4 px-4 rounded-xl shadow-lg text-sm font-bold text-white bg-slate-900 hover:bg-black focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition">
                <span id="btnText">Authenticate Session</span>
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="mailto:admin@conchcapital.co" class="text-xs font-semibold text-slate-400 hover:text-slate-900 transition">Contact System Administrator</a>
        </div>
    </div>
    
    <div class="mt-12 text-center text-[10px] text-slate-600 uppercase tracking-[0.2em]">
        Protocol 8.24-B // Secure Environment 
    </div>
</div>
<script src="js/config.js?v=20261123b"></script>
<script src="js/utils.js?v=20261123b"></script>
<script src="js/api.js?v=20261123b"></script>
<script src="js/forms.js?v=20261123b"></script>
<script src="js/modals.js?v=20261123b"></script>
<script src="js/routes.js?v=20261123b"></script>
<script src="js/main.js?v=20261123b"></script>
<script>
    // Admin login form submission
    document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const emailInput = document.getElementById('admin-email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            Utils?.showToast?.('Please enter both email and password', 'error');
            return;
        }

        // Show loading state
        submitBtn.disabled = true;
        btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...';

        try {
            // First, get CSRF token
            await API.auth.csrf();
            
            // Attempt login
            const response = await API.auth.login(email, password);
            
            // Check if user is admin
            if (!response.user || !response.user.is_admin) {
                // Logout immediately if not admin
                try {
                    await API.auth.logout();
                } catch (logoutError) {
                    console.error('Logout error:', logoutError);
                }
                
                Utils?.showToast?.('Access denied. Admin privileges required.', 'error');
                return;
            }

            // Success - redirect to admin dashboard
            Utils?.showToast?.('Admin access granted', 'success');
            
            setTimeout(() => {
                window.location.href = '/admin-dashboard.html';
            }, 500);

        } catch (error) {
            console.error('Admin login error:', error);
            const message = error.response?.message || error.message || 'Authentication failed';
            Utils?.showToast?.(message, 'error');
        } finally {
            submitBtn.disabled = false;
            btnText.textContent = 'Authenticate Session';
        }
    });
</script>
</body> </html>
