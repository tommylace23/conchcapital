<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=20261123">
    <title>Reset Password | ConchCapital</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center py-12 px-6" data-page="resetPassword">

<div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
        <a href="home.html" class="text-3xl font-bold tracking-tight text-slate-800 inline-block">Conch<span class="text-[#10B981]">Capital</span></a>
    </div>

    <!-- Reset Password Form -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-lg p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-lock text-green-600 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 mb-2">Reset Password</h1>
            <p class="text-slate-500 text-sm">Enter your new password below</p>
        </div>

        <form class="space-y-6" id="resetPasswordForm">
            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-widest mb-2">New Password</label>
                <div class="relative">
                    <input 
                        type="password" 
                        name="password"
                        id="password"
                        placeholder="Enter new password"
                        required
                        minlength="8"
                        class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#10B981] focus:border-[#10B981] outline-none pr-12"
                    >
                    <button type="button" onclick="togglePassword('password')" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-eye" id="passwordIcon"></i>
                    </button>
                </div>
                <p class="text-xs text-slate-500 mt-2">Must be at least 8 characters long</p>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-widest mb-2">Confirm Password</label>
                <div class="relative">
                    <input 
                        type="password" 
                        name="confirm_password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                        class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#10B981] focus:border-[#10B981] outline-none pr-12"
                    >
                    <button type="button" onclick="togglePassword('confirmPassword')" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-eye" id="confirmPasswordIcon"></i>
                    </button>
                </div>
                <p id="passwordMatch" class="hidden text-xs mt-2"></p>
            </div>

            <!-- Password Requirements -->
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
                <p class="text-xs font-bold text-slate-700 mb-2">Password Requirements:</p>
                <ul class="text-xs text-slate-600 space-y-1">
                    <li class="flex items-center gap-2">
                        <i class="fa-solid fa-check text-green-600 text-[10px]"></i>
                        At least 8 characters
                    </li>
                    <li class="flex items-center gap-2">
                        <i class="fa-solid fa-check text-green-600 text-[10px]"></i>
                        Contains uppercase and lowercase letters
                    </li>
                    <li class="flex items-center gap-2">
                        <i class="fa-solid fa-check text-green-600 text-[10px]"></i>
                        Contains at least one number
                    </li>
                </ul>
            </div>

            <button type="submit" class="w-full py-3.5 bg-[#10B981] text-white rounded-xl font-bold shadow-lg shadow-green-200 hover:opacity-90 transition">
                Reset Password
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="#" data-route="login" class="text-sm font-medium text-[#10B981] hover:underline">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to Login
            </a>
        </div>
    </div>
</div>

<script>
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(fieldId + 'Icon');
        
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // Password match validation
    document.getElementById('confirmPassword').addEventListener('input', function() {
        const password = document.getElementById('password').value;
        const confirmPassword = this.value;
        const matchMessage = document.getElementById('passwordMatch');
        
        if (confirmPassword.length > 0) {
            matchMessage.classList.remove('hidden');
            if (password === confirmPassword) {
                matchMessage.textContent = '✓ Passwords match';
                matchMessage.classList.remove('text-red-600');
                matchMessage.classList.add('text-green-600');
            } else {
                matchMessage.textContent = '✗ Passwords do not match';
                matchMessage.classList.remove('text-green-600');
                matchMessage.classList.add('text-red-600');
            }
        } else {
            matchMessage.classList.add('hidden');
        }
    });

    // Form submission
    document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        if (password !== confirmPassword) {
            alert('Passwords do not match');
            return;
        }
        
        // In production, this would be an API call
        console.log('Resetting password...');
        alert('Password reset successfully! Redirecting to login...');
        // window.location.href = '/login';
    });
</script>
<script src="js/config.js?v=20261123"></script>
<script src="js/utils.js?v=20261123"></script>
<script src="js/api.js?v=20261123"></script>
<script src="js/forms.js?v=20261123"></script>
<script src="js/modals.js?v=20261123"></script>
<script src="js/routes.js?v=20261123"></script>
<script src="js/main.js?v=20261123"></script>
</body>
</html>
