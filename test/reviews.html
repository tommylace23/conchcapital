<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Reviews | ConchCapital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=20261123c">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style> body { font-family: 'Inter', sans-serif; } </style>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ConchCapital",
      "url": "https://conchcapital.co",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "96",
        "bestRating": "5"
      }
    }
    </script>
</head>
<body class="bg-slate-50 min-h-screen" data-page="reviews">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="home.html" class="text-xl font-bold tracking-tight text-slate-800">Conch<span class="text-[#10B981]">Capital</span></a>
            <div class="flex items-center gap-4 text-sm font-medium">
                <a href="home.html" class="text-slate-500 hover:text-slate-900">Home</a>
                <a href="registration.html" class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold hover:bg-emerald-700 transition">Open Account</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-14">
        <div class="mb-10">
            <h1 class="text-3xl lg:text-4xl font-extrabold text-slate-900">Client Reviews</h1>
            <p class="text-slate-500 mt-2">Verified feedback from clients with funded accounts.</p>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 lg:p-8 mb-10">
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-6">
                <div class="text-center sm:text-left">
                    <p class="text-5xl font-black text-slate-900 leading-none">4.7</p>
                    <div class="text-amber-400 text-sm mt-2"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i></div>
                    <p class="text-xs text-slate-500 mt-1">96 verified reviews</p>
                </div>
                <div class="flex-1 w-full space-y-2">
                    <div class="flex items-center gap-3 text-xs text-slate-500">
                        <span class="w-8">5 star</span>
                        <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-500" style="width: 82%"></div></div>
                        <span class="w-8 text-right">79</span>
                    </div>
                    <div class="flex items-center gap-3 text-xs text-slate-500">
                        <span class="w-8">4 star</span>
                        <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-400" style="width: 15%"></div></div>
                        <span class="w-8 text-right">14</span>
                    </div>
                    <div class="flex items-center gap-3 text-xs text-slate-500">
                        <span class="w-8">3 star</span>
                        <div class="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-amber-400" style="width: 3%"></div></div>
                        <span class="w-8 text-right">3</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-4 flex items-center justify-between">
            <p id="reviewCount" class="text-sm text-slate-500">Loading reviews…</p>
        </div>

        <div id="reviewsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <div class="text-center mt-8">
            <button id="loadMoreBtn" class="px-6 py-3 bg-white border border-gray-200 text-slate-700 rounded-xl text-sm font-bold hover:bg-gray-50 transition">
                Show more reviews
            </button>
        </div>

        <div class="text-center mt-12">
            <a href="registration.html" class="inline-flex items-center gap-2 px-8 py-3.5 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 transition">
                Open an account <i class="fa-solid fa-arrow-right text-xs"></i>
            </a>
        </div>
    </main>

<script src="js/reviews-data.js?v=20261123c"></script>
<script>
    (function () {
        const grid = document.getElementById('reviewsGrid');
        if (!grid || !window.REVIEWS) return;

        const PAGE = 24;
        let shown = 0;

        const stars = (n) => '<i class="fa-solid fa-star"></i>'.repeat(n) + '<i class="fa-regular fa-star"></i>'.repeat(5 - n);
        const initials = (name) => name.trim().charAt(0).toUpperCase();
        const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        function card(r) {
            const img = `assets/images/reviews/${r.slug}.jpg`;
            return `
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 flex flex-col">
                <div class="flex items-center gap-3 mb-4">
                    <div class="relative w-11 h-11 shrink-0">
                        <div class="absolute inset-0 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-sm font-bold">${initials(r.name)}</div>
                        <img src="${img}" alt="" class="absolute inset-0 w-11 h-11 rounded-full object-cover" onerror="this.style.display='none'">
                    </div>
                    <div>
                        <p class="text-sm font-bold text-slate-900">${r.name}</p>
                        <p class="text-xs text-slate-500">${r.city}</p>
                    </div>
                    <span class="ml-auto text-[9px] font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded-full uppercase tracking-widest">Verified</span>
                </div>
                <div class="text-amber-400 text-xs mb-3">${stars(r.stars)}</div>
                <p class="text-sm text-slate-600 leading-relaxed flex-1">&ldquo;${r.quote}&rdquo;</p>
                <p class="text-[11px] text-slate-400 mt-4">${fmtDate(r.date)}</p>
            </div>`;
        }

        function render() {
            const slice = window.REVIEWS.slice(shown, shown + PAGE);
            grid.insertAdjacentHTML('beforeend', slice.map(card).join(''));
            shown += slice.length;
            document.getElementById('reviewCount').textContent = `Showing ${shown} of ${window.REVIEWS.length} reviews`;
            document.getElementById('loadMoreBtn').style.display = shown >= window.REVIEWS.length ? 'none' : '';
        }

        document.getElementById('loadMoreBtn').addEventListener('click', render);
        render();
    })();
</script>

    <script src="js/config.js?v=20261123c"></script>
    <script src="js/utils.js?v=20261123c"></script>
    <script src="js/api.js?v=20261123c"></script>
    <script src="js/routes.js?v=20261123c"></script>
    <script src="js/main.js?v=20261123c"></script>
</body>
</html>
